// niveau1.cfg : scenario de test du niveau 1 (bouton + porte).
// Lance par : tools/scenario.sh orion_niveau1 niveau1
//
// Chaque « wait N » attend N passages du tampon de commandes, soit N/2
// trames. Les positions sortent dans le journal ; scenario.sh les lit.
//
// Le joueur est teleporte par setviewpos (x y z angle) : la commande
// n'existe qu'avec devmap, qui active les triches.

wait 300

// 1. Porte fermee : depuis la baie (y = 56), on avance. Le joueur doit
// s'arreter contre la porte, vers x = 104 (cloison en x = 120, rayon 15).
setviewpos 0 56 40 0
wait 40
screenshot n1_ferme
+forward
wait 200
viewpos
-forward

// 2. Depuis le point d'apparition (y = -40), on avance contre le bouton
// (sur la cloison, y entre -56 et -24). Le contact l'enfonce, la porte monte.
setviewpos -128 -40 24 0
wait 20
+forward
wait 200
-forward
wait 400

// 3. Porte ouverte : le meme trajet traverse la cloison jusqu'au mur est
// (x = 240 environ).
setviewpos 0 56 40 0
wait 40
screenshot n1_ouvert
+forward
wait 250
viewpos
-forward
quit
