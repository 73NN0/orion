// default.cfg : les réglages d'usine d'Orion, lus à chaque démarrage,
// avant orion.cfg (les réglages du joueur, écrits par le jeu à la sortie,
// dans ~/.config/orion/reach/) et autoexec.cfg. Ce qui est dans orion.cfg
// l'emporte donc sur ce fichier : supprimer orion.cfg pour repartir de ici.
seta com_maxfps "125"
seta r_fullscreen "0"
seta r_mode "4"
seta s_volume "0.8"

bind ESCAPE "togglemenu"
bind ` "toggleconsole"

// Sans .pk3 chargé, un serveur « pur » rejette son propre client.
seta sv_pure 0
// Pas de fichiers de bots : on n'initialise pas la botlib.
seta bot_enable 0
exec keys.cfg

